<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  /* EYE-SOOTHING CLEAN DARK THEME */
  --primary: #14b8a6; /* Soothing Cyan / Teal */
  --primary-hover: #0d9488;
  --primary-light: rgba(20, 184, 166, 0.15);
  --secondary: #6366f1;
  --accent: #f43f5e;
  --bg: #0f172a;
  --card: #1e293b;
  --card-solid: #1e293b;
  --text: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-light: #94a3b8;
  --border: #334155;
  --btn-text: #000000;
  --success: #10b981;
  --error: #ef4444;
  --warning: #f59e0b;
  --whatsapp: #25d366;
  --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
  --shadow-hover: 0 15px 30px -5px rgba(20, 184, 166, 0.25);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: all 0.25s ease-in-out;
  --navbar-height: 66px;
  --font: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, sans-serif;
  --overlay: rgba(15, 23, 42, 0.75);
  --blur: blur(12px);
}

[data-theme='light'] {
  --bg: #f8fafc;
  --card: #ffffff;
  --card-solid: #ffffff;
  --text: #0f172a;
  --text-secondary: #475569;
  --text-light: #64748b;
  --border: #e2e8f0;
  --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
}

html { scroll-behavior: smooth; font-size: 16px; }
body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; transition: background var(--transition), color var(--transition); min-height: 100vh; overflow-x: hidden; }
a { text-decoration: none; color: inherit; cursor: pointer; }
ul { list-style: none; }
img { max-width: 100%; display: block; }
button { cursor: pointer; border: none; font-family: inherit; font-size: inherit; outline: none; }
input, select, textarea { font-family: inherit; font-size: inherit; }

.container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

@keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes ringRotate { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
.fade-in { animation: fadeInUp 0.4s ease-out forwards; }

/* LOGO RING LIGHT STYLING */
.logo-container { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.logo-ring-wrap { position: relative; width: 40px; height: 40px; border-radius: 50%; padding: 2.5px; background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent), var(--primary)); background-size: 300% 300%; animation: ringRotate 4s linear infinite; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px var(--primary-light); flex-shrink: 0; }
.logo-ring-wrap img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: var(--card-solid); }

.logo-text { font-size: 1.35rem; font-weight: 800; line-height: 1; color: var(--primary); white-space: nowrap; }
.logo-text span { color: var(--text); }

.navbar { position: fixed; top: 0; left: 0; right: 0; height: var(--navbar-height); background: var(--card); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border-bottom: 1px solid var(--border); z-index: 1000; transition: var(--transition); }
.navbar .container { display: flex; align-items: center; justify-content: space-between; height: 100%; }
.nav-left { display: flex; align-items: center; gap: 12px; }
.hamburger { display: flex; flex-direction: column; gap: 5px; background: none; padding: 8px; cursor: pointer; border-radius: 8px; }
.hamburger:hover { background: var(--primary-light); }
.hamburger span { display: block; width: 22px; height: 2.5px; background: var(--primary); border-radius: 2px; }

.nav-actions { display: flex; align-items: center; gap: 8px; }
.nav-actions button { background: var(--bg); border: 1px solid var(--border); width: 42px; height: 42px; border-radius: 50%; color: var(--text); font-size: 1.1rem; position: relative; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
.nav-actions button:hover { background: var(--primary); color: #000; border-color: var(--primary); transform: translateY(-2px); }
.cart-btn .cart-count { position: absolute; top: -2px; right: -2px; background: var(--accent); color: #fff; font-size: 0.72rem; font-weight: 800; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--card-solid); }

.sub-notice-wrapper { position: fixed; top: var(--navbar-height); left: 0; right: 0; z-index: 999; background: var(--primary); color: #000; font-weight: 700; box-shadow: var(--shadow); border-bottom: 1px solid var(--border); }
.top-notice-bar { font-size: 0.88rem; padding: 8px 12px; overflow: hidden; white-space: nowrap; display: flex; align-items: center; justify-content: space-between; }
.notice-marquee { overflow: hidden; white-space: nowrap; flex: 1; }
.notice-content { display: inline-block; padding-left: 100%; animation: marquee 22s linear infinite; }
.offer-timer-badge { background: rgba(0,0,0,0.2); padding: 3px 10px; border-radius: 50px; font-size: 0.75rem; font-weight: 800; margin-left: 12px; display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
@keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

.sidebar-overlay { position: fixed; inset: 0; background: var(--overlay); backdrop-filter: blur(6px); z-index: 1050; opacity: 0; pointer-events: none; transition: var(--transition); }
.sidebar-overlay.active { opacity: 1; pointer-events: auto; }
.sidebar { position: fixed; top: 0; left: -300px; bottom: 0; width: 300px; background: var(--card-solid); z-index: 1100; padding: 80px 20px 20px; overflow-y: auto; transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1); border-right: 1px solid var(--border); box-shadow: 10px 0 30px rgba(0,0,0,0.3); }
.sidebar.open { left: 0; }
.sidebar h3 { font-size: 0.8rem; text-transform: uppercase; color: var(--primary); margin-bottom: 12px; letter-spacing: 1.2px; font-weight: 700; }
.sidebar .category-link { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: var(--radius-sm); color: var(--text); font-size: 0.98rem; font-weight: 600; text-transform: capitalize; transition: var(--transition); margin-bottom: 6px; border: 1px solid transparent; }
.sidebar .category-link:hover, .sidebar .category-link.active { background: var(--primary-light); color: var(--primary); border-color: var(--border); transform: translateX(4px); }

.main { padding-top: calc(var(--navbar-height) + 16px); padding-bottom: 80px; min-height: 100vh; }
body.has-notice .main { padding-top: calc(var(--navbar-height) + 48px); }

.section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.section-title h2 { font-size: 1.35rem; font-weight: 800; color: var(--text); }

/* MOBILE CHARGER & ACCESSORY PRODUCT CARDS */
.product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.product-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); transition: var(--transition); cursor: pointer; position: relative; display: flex; flex-direction: column; }
.product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: var(--primary); }
.product-card .img-wrap { position: relative; padding-top: 100%; background: #000; overflow: hidden; }
.product-card .img-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
.product-card:hover .img-wrap img { transform: scale(1.06); }

/* FAST CHARGER SPECIFICATION BADGES */
.discount-badge { position: absolute; top: 10px; left: 10px; background: var(--accent); color: #fff; font-size: 0.72rem; font-weight: 800; padding: 4px 10px; border-radius: 50px; z-index: 2; box-shadow: 0 4px 10px rgba(244, 63, 94, 0.4); }
.charger-spec-badge { position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.75); color: #22d3ee; border: 1px solid #06b6d4; font-size: 0.68rem; font-weight: 800; padding: 3px 8px; border-radius: 6px; z-index: 2; backdrop-filter: blur(4px); }
.stock-badge-low { position: absolute; bottom: 10px; right: 10px; background: rgba(239, 68, 68, 0.85); color: #fff; font-size: 0.68rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; z-index: 2; }

.product-card .info { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
.product-card .category-tag { font-size: 0.72rem; color: #0d9488; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
.product-card .name { font-size: 0.98rem; font-weight: 800; height: 44px; overflow: hidden; line-height: 1.35; color: var(--text); }
.product-card .price-row { display: flex; align-items: baseline; gap: 8px; margin-top: auto; }
.product-card .current-price { font-size: 1.25rem; font-weight: 800; color: var(--primary); }
.product-card .original-price { font-size: 0.85rem; color: var(--text-light); text-decoration: line-through; }

.card-action-btns { display: flex; gap: 6px; margin-top: 10px; }
.product-card .add-cart-btn { flex: 1; padding: 10px; background: #0d9488; color: #ffffff !important; border-radius: var(--radius-sm); font-size: 0.88rem; font-weight: 800; text-align: center; transition: var(--transition); }
.product-card .add-cart-btn:hover { background: var(--primary-hover); }
.product-card .add-cart-btn:disabled { background: var(--border); color: var(--text-light); cursor: not-allowed; }
.product-card .whatsapp-btn { padding: 10px 12px; background: var(--whatsapp); color: #fff; border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 700; text-align: center; display: flex; align-items: center; justify-content: center; }

.floating-wa { position: fixed; bottom: 80px; right: 24px; z-index: 990; background: var(--whatsapp); color: #fff; width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4); transition: var(--transition); }

.toast-container { position: fixed; top: calc(var(--navbar-height) + 16px); right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
.toast { background: var(--card-solid); color: var(--text); padding: 14px 22px; border-radius: var(--radius-sm); box-shadow: var(--shadow); font-size: 0.9rem; border-left: 5px solid var(--primary); font-weight: 700; animation: fadeInUp 0.3s ease; }

.modal-overlay { position: fixed; inset: 0; background: var(--overlay); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(8px); }
.modal-overlay.show { display: flex; }
.modal-box { background: var(--card-solid); width: 90%; max-width: 440px; padding: 28px; border-radius: var(--radius); position: relative; box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); animation: fadeInUp 0.3s ease; }

.admin-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 0.82rem; font-weight: 700; margin-bottom: 6px; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); outline: none; transition: var(--transition); }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }
.admin-tab-btn { padding: 10px 20px; border-radius: 50px; background: var(--bg); border: 1px solid var(--border); font-weight: 700; font-size: 0.88rem; color: var(--text-secondary); cursor: pointer; transition: var(--transition); flex-shrink: 0; }
.admin-tab-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

.order-subtab-btn { padding: 8px 16px; border-radius: 50px; background: var(--bg); border: 1px solid var(--border); font-weight: 700; font-size: 0.8rem; color: var(--text-secondary); cursor: pointer; transition: var(--transition); }
.order-subtab-btn.active { background: var(--secondary); color: #fff; border-color: var(--secondary); }

.status-badge { padding: 4px 12px; border-radius: 50px; font-weight: 700; font-size: 0.78rem; display: inline-block; }
.status-pending { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid var(--warning); }
.status-confirmed { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); }
.status-cancelled { background: rgba(239, 68, 68, 0.15); color: var(--error); border: 1px solid var(--error); }

.stat-box { background: var(--bg); border: 1px solid var(--border); padding: 18px; border-radius: var(--radius-sm); text-align: center; }
.stat-box .title { font-size: 0.82rem; color: var(--text-secondary); font-weight: 700; }
.stat-box .value { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-top: 4px; }

.footer { background: var(--card); border-top: 1px solid var(--border); padding: 32px 0; margin-top: 60px; text-align: center; font-size: 0.9rem; color: var(--text-secondary); }

@media (min-width: 576px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 768px) { .product-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } .hamburger { display: none; } }
@media (min-width: 992px) { .product-grid { grid-template-columns: repeat(5, 1fr); } }
</style>
</head>
<body>

<script>
// ============ FIREBASE CONFIGURATION ============
const firebaseConfig = {
  apiKey: "AIzaSyBSKGWco4wopur-nCB6u0HFpKHFr3BPzKc",
  authDomain: "jibon-telecom-1c937.firebaseapp.com",
  databaseURL: "https://jibon-telecom-1c937-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "jibon-telecom-1c937",
  storageBucket: "jibon-telecom-1c937.firebasestorage.app",
  messagingSenderId: "669868675107",
  appId: "1:669868675107:web:1e732c8f6bbcd8faac2196",
  measurementId: "G-ZP1MTBXKEG"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

function sanitize(str) {
  if (!str) return '';
  const temp = document.createElement('div');
  temp.textContent = str;
  return temp.innerHTML;
}

const App = {
  state: {
    products: [],
    categories: [],
    orders: [],
    coupons: {},
    cart: [],
    tgAdmins: [],
    systemAdmins: [],
    blackList: [],
    pendingTgPosts: {},
    tgPostingSteps: {},
    currentView: 'home',
    currentCategory: 'all',
    darkMode: true,
    isAdminLoggedIn: false,
    currentAdminRole: 'super_admin',
    adminTab: 'analytics',
    orderFilterTab: 'pending',
    editingProductId: null,
    appliedDiscount: 0,
    deliveryCharge: 60,
    logoClicks: 0,
    timerInterval: null,
    lastTgOffsets: {},
    searchTrackPhone: '',
    generatedOtp: '',
    settings: {
      maintenanceMode: false,
      noticeEnable: true,
      noticeText: '🎉 বিশেষ অফার! অরিজিনাল ফাস্ট চার্জার ও ক্যাবলস এ মেগা ডিসকাউন্ট!',
      noticeEndTime: '',
      logoType: 'img_text',
      logoUrl: 'https://via.placeholder.com/100',
      logoUrl2: '',
      logoText1: 'JIBON',
      logoText2: 'Zone',
      bkash: '',
      nagad: '',
      whatsapp: '8801967181256'
    }
  },

  init() {
    this.loadCart();
    this.loadDarkMode();
    this.syncFirebase();
    this.bindEvents();
    this.bindKeyboardShortcuts();
    this.startTelegramPolling();
  },

  syncFirebase() {
    db.ref('products').on('value', snapshot => {
      const data = snapshot.val();
      this.state.products = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
      this.render();
    });

    db.ref('orders').on('value', snapshot => {
      const data = snapshot.val();
      this.state.orders = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })).reverse() : [];
      if (this.state.currentView === 'admin' || this.state.currentView === 'track') this.renderView();
    });

    db.ref('tgAdmins').on('value', snapshot => {
      const data = snapshot.val();
      this.state.tgAdmins = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
      if (this.state.currentView === 'admin' && this.state.adminTab === 'botManager') this.renderView();
    });

    db.ref('systemAdmins').on('value', snapshot => {
      const data = snapshot.val();
      this.state.systemAdmins = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
      if (this.state.currentView === 'admin' && this.state.adminTab === 'roleManager') this.renderView();
    });

    db.ref('blackList').on('value', snapshot => {
      const data = snapshot.val();
      this.state.blackList = data ? Object.values(data) : [];
    });

    db.ref('categories').on('value', snapshot => {
      const data = snapshot.val();
      if (data) {
        const catList = Array.isArray(data) ? data : Object.values(data);
        this.state.categories = [...new Set(catList.map(c => c.toLowerCase().trim()))];
      } else {
        this.state.categories = [];
      }
      this.renderSidebarCategories();
      if (this.state.currentView === 'admin' && this.state.adminTab === 'products') this.renderView();
    });

    db.ref('coupons').on('value', snapshot => {
      this.state.coupons = snapshot.val() || {};
      if (this.state.currentView === 'admin') this.renderView();
    });

    db.ref('settings').on('value', snapshot => {
      const data = snapshot.val();
      if (data) {
        this.state.settings = { ...this.state.settings, ...data };
      }
      this.applyShopSettings();
    });
  },

  applyShopSettings() {
    const noticeWrapper = document.getElementById('notice-wrapper');
    const noticeText = document.getElementById('notice-text');
    const timerBadge = document.getElementById('notice-timer-badge');
    const timerText = document.getElementById('notice-timer-text');

    if (this.state.timerInterval) clearInterval(this.state.timerInterval);

    if (this.state.settings.noticeEnable && this.state.settings.noticeText) {
      noticeWrapper.style.display = 'block';
      document.body.classList.add('has-notice');
      noticeText.textContent = this.state.settings.noticeText;

      if (this.state.settings.noticeEndTime) {
        timerBadge.style.display = 'inline-flex';
        const targetTime = new Date(this.state.settings.noticeEndTime).getTime();

        const updateCountdown = () => {
          const now = new Date().getTime();
          const distance = targetTime - now;

          if (distance < 0) {
            clearInterval(this.state.timerInterval);
            noticeWrapper.style.display = 'none';
            document.body.classList.remove('has-notice');
            return;
          }

          const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((distance % (1000 * 60)) / 1000);

          timerText.textContent = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        };

        updateCountdown();
        this.state.timerInterval = setInterval(updateCountdown, 1000);
      } else {
        timerBadge.style.display = 'none';
      }
    } else {
      noticeWrapper.style.display = 'none';
      document.body.classList.remove('has-notice');
    }

    const logoEl = document.getElementById('main-logo');
    const s = this.state.settings;

    if (logoEl) {
      if (s.logoType === 'img_text' && s.logoUrl) {
        logoEl.innerHTML = `
          <div class="logo-ring-wrap"><img src="${s.logoUrl}" alt="Logo"></div>
          <div class="logo-text">JIBON <span>Zone</span></div>
        `;
      } else if (s.logoType === 'double_img' && s.logoUrl) {
        logoEl.innerHTML = `
          <div class="logo-ring-wrap"><img src="${s.logoUrl}" alt="Logo 1"></div>
          ${s.logoUrl2 ? `<div class="logo-ring-wrap"><img src="${s.logoUrl2}" alt="Logo 2"></div>` : ''}
        `;
      } else {
        logoEl.innerHTML = `<div class="logo-text">JIBON <span>Zone</span></div>`;
      }
    }

    const waBtn = document.getElementById('floating-whatsapp');
    if (waBtn) {
      const num = (this.state.settings.whatsapp || '8801967181256').replace(/[^0-9]/g, '');
      waBtn.href = `https://wa.me/${num}?text=${encodeURIComponent('হ্যালো! আমি আপনার শপ থেকে তথ্য জানতে চাই।')}`;
    }
  },

  loadCart() {
    const stored = localStorage.getItem('jibon_cart');
    this.state.cart = stored ? JSON.parse(stored) : [];
    this.updateCartCount();
  },

  saveCart() {
    localStorage.setItem('jibon_cart', JSON.stringify(this.state.cart));
    this.updateCartCount();
  },

  loadDarkMode() {
    const saved = localStorage.getItem('jibon_dark');
    this.state.darkMode = saved !== null ? saved === 'true' : true;
    if (this.state.darkMode) {
      document.documentElement.removeAttribute('data-theme');
      document.getElementById('dark-icon').textContent = '☀️';
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      document.getElementById('dark-icon').textContent = '🌙';
    }
  },

  toggleDarkMode() {
    this.state.darkMode = !this.state.darkMode;
    if (this.state.darkMode) {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
    localStorage.setItem('jibon_dark', this.state.darkMode);
    document.getElementById('dark-icon').textContent = this.state.darkMode ? '☀️' : '🌙';
  },

  updateCartCount() {
    const count = this.state.cart.reduce((s, i) => s + i.quantity, 0);
    document.querySelectorAll('.cart-count').forEach(el => el.textContent = count);
  },

  navigate(view) {
    this.state.currentView = view;
    this.renderView();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  },

  render() {
    this.updateCartCount();
    this.renderSidebarCategories();
    this.renderView();
  },

  renderSidebarCategories() {
    const el = document.getElementById('sidebar-cat-list');
    if (!el) return;
    let html = `<a class="category-link ${this.state.currentCategory === 'all' ? 'active' : ''}" onclick="App.setCategory('all')">সকল প্রোডাক্ট <span>➔</span></a>`;
    this.state.categories.forEach(c => {
      html += `<a class="category-link ${this.state.currentCategory === c ? 'active' : ''}" onclick="App.setCategory('${c}')">${sanitize(c)} <span>➔</span></a>`;
    });
    el.innerHTML = html;
  },

  getFilteredProducts() {
    let list = [...this.state.products];
    if (this.state.currentCategory !== 'all') {
      list = list.filter(p => p.category && p.category.toLowerCase().trim() === this.state.currentCategory.toLowerCase().trim());
    }
    return list;
  },

  renderView() {
    const container = document.getElementById('view-container');
    if (!container) return;

    if (this.state.settings.maintenanceMode && !this.state.isAdminLoggedIn) {
      container.innerHTML = `
        <div class="fade-in" style="text-align:center; padding:100px 20px;">
          <div style="font-size:5rem; margin-bottom:12px">🛠️</div>
          <h2 style="font-weight:800; font-size:1.8rem; color:var(--primary)">ওয়েবসাইট আপডেট চলছে!</h2>
          <p style="color:var(--text-secondary); margin-top:8px">আমাদের সাইটে নতুন ফিচার যোগ করার কাজ চলছে। সাময়িক অসুবিধার জন্য আমরা আন্তরিকভাবে দুঃখিত।</p>
        </div>
      `;
      return;
    }

    switch (this.state.currentView) {
      case 'home':
        this.renderHome(container);
        break;
      case 'cart':
        this.renderCart(container);
        break;
      case 'checkout':
        this.renderCheckout(container);
        break;
      case 'track':
        this.renderOrderTracking(container);
        break;
      case 'success':
        container.innerHTML = `
          <div class="fade-in" style="text-align:center; padding:80px 20px;">
            <div style="font-size:4.5rem; color:var(--success); margin-bottom:12px">✅</div>
            <h2 style="font-size:1.8rem; font-weight:800; color:var(--primary)">অর্ডার সফলভাবে সম্পন্ন হয়েছে!</h2>
            <p style="color:var(--text-secondary); margin-bottom:24px; font-size:1rem">আমাদের শপ থেকে কেনাকাটা করার জন্য আপনাকে ধন্যবাদ। দ্রুততম সময়ে কুরিয়ারে ক্যাশ অন ডেলিভারিতে পার্সেল পৌঁছে দেওয়া হবে।</p>
            <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap">
              <button style="padding:12px 28px; background:var(--primary); color:#000; border-radius:50px; font-weight:800;" onclick="App.navigate('track')">🔍 অর্ডার ট্র্যাকিং করুন</button>
              <button style="padding:12px 28px; background:var(--card-solid); color:var(--text); border:1px solid var(--border); border-radius:50px; font-weight:700" onclick="App.navigate('home')">আরও কেনাকাটা করুন</button>
            </div>
          </div>
        `;
        break;
      case 'admin':
        this.renderAdmin(container);
        break;
      default:
        this.renderHome(container);
    }
  },

  renderHome(container) {
    const filtered = this.getFilteredProducts();
    const featured = this.state.products.filter(p => p.featured);
    const categoryTitle = this.state.currentCategory === 'all' ? 'সকল প্রোডাক্ট' : this.state.currentCategory;

    container.innerHTML = `
      ${featured.length > 0 && this.state.currentCategory === 'all' ? `
        <div class="section-title fade-in"><h2>⭐ ফিচারড কালেকশন (Featured)</h2></div>
        <div class="product-grid fade-in" style="margin-bottom:32px">${this.renderCards(featured)}</div>
      ` : ''}

      <div class="section-title fade-in">
        <h2>${sanitize(categoryTitle)}</h2>
        <span style="color:var(--primary); font-weight:800; background:var(--primary-light); padding:4px 14px; border-radius:50px; font-size:0.85rem; border:1px solid var(--border)">${filtered.length} টি আইটেম</span>
      </div>

      <div class="product-grid fade-in">
        ${filtered.length > 0 ? this.renderCards(filtered) : `<div style="grid-column:1/-1; text-align:center; padding:60px; color:var(--text-secondary); background:var(--card); border-radius:var(--radius); border:1px solid var(--border)">এই ক্যাটাগরিতে কোনো প্রোডাক্ট পাওয়া যায়নি</div>`}
      </div>
    `;
  },

  renderCards(products) {
    const waNum = (this.state.settings.whatsapp || '8801967181256').replace(/[^0-9]/g, '');

    return products.map(p => {
      const discount = p.originalPrice > p.price ? Math.round((1 - p.price / p.originalPrice) * 100) : 0;
      const inCart = this.state.cart.find(c => c.productId === p.id);
      const isOut = p.stock !== undefined && Number(p.stock) <= 0;
      const isLow = p.stock !== undefined && Number(p.stock) <= 3 && Number(p.stock) > 0;

      const waMessage = encodeURIComponent(`হ্যালো! আমি আপনার শপ থেকে এই চার্জার/প্রোডাক্টটি অর্ডার করতে চাই:\nপ্রোডাক্ট: ${p.name}\nমূল্য: ৳${p.price}`);

      return `
        <div class="product-card">
          <div class="img-wrap">
            <img src="${p.image || p.img || 'https://via.placeholder.com/300'}" alt="${sanitize(p.name)}" loading="lazy" onerror="this.src='https://via.placeholder.com/300'">
            ${discount > 0 ? `<span class="discount-badge">-${discount}%</span>` : ''}
            <span class="charger-spec-badge">⚡ FAST CHARGE</span>
            ${isLow ? `<span class="stock-badge-low">স্টক: ${p.stock}টি</span>` : ''}
          </div>
          <div class="info">
            <span class="category-tag">${sanitize(p.category || 'FAST CHARGERS')}</span>
            <div class="name">${sanitize(p.name)}</div>
            <div class="price-row">
              <span class="current-price">৳${Number(p.price).toLocaleString()}</span>
              ${p.originalPrice > p.price ? `<span class="original-price">৳${Number(p.originalPrice).toLocaleString()}</span>` : ''}
            </div>
            <div class="card-action-btns">
              <button class="add-cart-btn" ${isOut ? 'disabled' : ''} onclick="App.addToCart('${p.id}')">
                ${isOut ? 'স্টক শেষ' : (inCart ? '✓ কার্টে যুক্ত' : '🛒 কার্টে রাখুন')}
              </button>
              <a href="https://wa.me/${waNum}?text=${waMessage}" target="_blank" class="whatsapp-btn" title="WhatsApp-এ অর্ডার করুন">
                <i class="fab fa-whatsapp"></i>
              </a>
            </div>
          </div>
        </div>
      `;
    }).join('');
  },

  renderCart(container) {
    if (this.state.cart.length === 0) {
      container.innerHTML = `
        <div class="fade-in" style="text-align:center; padding:80px 20px; background:var(--card); border-radius:var(--radius); border:1px solid var(--border)">
          <div style="font-size:4rem; margin-bottom:12px">🛒</div>
          <h2 style="font-weight:800; color:var(--primary)">আপনার কার্ট খালি রয়েছে</h2>
          <p style="color:var(--text-secondary); margin-top:4px">পছন্দের চার্জার বা অ্যাকসেসরিজ যোগ করতে শপে ব্রাউজ করুন।</p>
          <button style="margin-top:20px; padding:12px 32px; background:var(--primary); color:#000; border-radius:50px; font-weight:800;" onclick="App.navigate('home')">কেনাকাটা শুরু করুন</button>
        </div>
      `;
      return;
    }

    let subtotal = 0;
    const items = this.state.cart.map(item => {
      const p = this.state.products.find(x => x.id === item.productId) || {};
      const total = (p.price || 0) * item.quantity;
      subtotal += total;
      return `
        <div style="background:var(--card); backdrop-filter:var(--blur); padding:16px; border-radius:var(--radius-sm); border:1px solid var(--border); display:flex; gap:16px; align-items:center; margin-bottom:12px; box-shadow:var(--shadow)">
          <img src="${p.image || p.img}" style="width:70px; height:70px; object-fit:contain; background:rgba(255,255,255,0.03); border-radius:8px; padding:4px">
          <div style="flex:1">
            <div style="font-weight:700; font-size:0.95rem">${sanitize(p.name || 'আইটেম')}</div>
            <div style="color:var(--primary); font-weight:800; font-size:1.05rem">৳${Number(p.price || 0).toLocaleString()}</div>
          </div>
          <div style="display:flex; align-items:center; gap:10px; background:var(--card-solid); padding:4px 8px; border-radius:50px; border:1px solid var(--border)">
            <button style="width:28px; height:28px; background:var(--bg); border-radius:50%; font-weight:700; color:var(--text)" onclick="App.updateCartQty('${item.productId}', -1)">-</button>
            <span style="font-weight:700; min-width:18px; text-align:center">${item.quantity}</span>
            <button style="width:28px; height:28px; background:var(--bg); border-radius:50%; font-weight:700; color:var(--text)" onclick="App.updateCartQty('${item.productId}', 1)">+</button>
          </div>
        </div>
      `;
    }).join('');

    container.innerHTML = `
      <h2 class="fade-in" style="margin-bottom:20px; font-weight:800; color:var(--primary)">🛒 আপনার কার্ট (${this.state.cart.length})</h2>
      <div class="fade-in">${items}</div>
      <div class="fade-in" style="background:var(--card); backdrop-filter:var(--blur); border:1px solid var(--border); padding:24px; border-radius:var(--radius); margin-top:20px; box-shadow:var(--shadow)">
        <div style="display:flex; justify-content:space-between; font-weight:800; font-size:1.2rem">
          <span>মোট পণ্য মূল্য:</span>
          <span style="color:var(--primary)">৳${subtotal.toLocaleString()}</span>
        </div>
        <button style="width:100%; padding:14px; background:var(--primary); color:#000; font-weight:800; border-radius:var(--radius-sm); margin-top:20px;" onclick="App.navigate('checkout')">অর্ডার করতে এগিয়ে যান ➔</button>
      </div>
    `;
  },

  renderCheckout(container) {
    let subtotal = 0;
    this.state.cart.forEach(c => {
      const p = this.state.products.find(x => x.id === c.productId);
      if (p) subtotal += p.price * c.quantity;
    });

    const totalBeforeDiscount = subtotal + this.state.deliveryCharge;
    const finalTotal = Math.max(0, totalBeforeDiscount - this.state.appliedDiscount);

    container.innerHTML = `
      <h2 class="fade-in" style="margin-bottom:20px; font-weight:800; color:var(--primary)">📋 ক্যাশ অন ডেলিভারি কনফার্মেশন</h2>
      <div class="fade-in" style="background:var(--card); backdrop-filter:var(--blur); border:1px solid var(--border); padding:28px; border-radius:var(--radius); box-shadow:var(--shadow)">
        <div class="form-group">
          <label>আপনার পুরো নাম *</label>
          <input type="text" id="cust-name" placeholder="যেমন: মোঃ জিবন হাবিব" required>
        </div>
        <div class="form-group">
          <label>মোবাইল নম্বর *</label>
          <input type="tel" id="cust-phone" placeholder="০১৭XXXXXXXX" required>
        </div>
        <div class="form-group">
          <label>ডেলিভারি এলাকা নির্বাচন করুন *</label>
          <select id="cust-zone" onchange="App.updateDeliveryCharge(this.value)">
            <option value="inside">ঢাকার ভেতরে (ডেলিভারি চার্জ ৳৬০)</option>
            <option value="outside">ঢাকার বাইরে (ডেলিভারি চার্জ ৳১২০)</option>
          </select>
        </div>
        <div class="form-group">
          <label>সম্পূর্ণ ডেলিভারি ঠিকানা *</label>
          <textarea id="cust-address" placeholder="বাসা/রোড নম্বর, এলাকা, থানা, জেলা" style="height:80px"></textarea>
        </div>

        <div class="form-group">
          <label>কুপন কোড (যদি থাকে)</label>
          <div style="display:flex; gap:10px">
            <input type="text" id="coupon-input" placeholder="যেমন: EID20" style="text-transform:uppercase">
            <button style="padding:10px 20px; background:var(--primary); color:#000; border-radius:var(--radius-sm); font-weight:800" onclick="App.applyCoupon()">প্রয়োগ</button>
          </div>
          <small id="coupon-msg" style="display:block; margin-top:6px; font-weight:700"></small>
        </div>

        <div class="form-group">
          <label>পেমেন্ট মেথড নির্বাচন করুন</label>
          <select id="cust-payment" onchange="App.togglePaymentDetails()">
            <option value="COD">ক্যাশ অন ডেলিভারি (COD)</option>
            <option value="bKash">বিকাশ (bKash)</option>
            <option value="Nagad">নগদ (Nagad)</option>
          </select>
        </div>

        <div id="payment-extra-box" style="display:none; background:var(--card-solid); padding:16px; border-radius:var(--radius-sm); border:1px solid var(--border); margin-bottom:16px">
          <p id="payment-instructions" style="font-size:0.88rem; color:var(--primary); font-weight:700; margin-bottom:10px"></p>
          <div class="form-group"><input type="text" id="cust-sender" placeholder="যে নম্বর থেকে সেন্ড মানি করেছেন"></div>
          <div class="form-group" style="margin-bottom:0"><input type="text" id="cust-trx" placeholder="Transaction ID (TrxID)"></div>
        </div>

        <div style="margin:20px 0; padding-top:16px; border-top:1px solid var(--border); font-size:0.95rem">
          <div style="display:flex; justify-content:space-between; margin-bottom:6px"><span>পণ্যের মূল্য:</span> <span>৳${subtotal.toLocaleString()}</span></div>
          <div style="display:flex; justify-content:space-between; margin-bottom:6px"><span>ডেলিভারি চার্জ:</span> <span>৳${this.state.deliveryCharge}</span></div>
          ${this.state.appliedDiscount > 0 ? `<div style="display:flex; justify-content:space-between; color:var(--success); font-weight:700"><span>কুপন ছাড়:</span> <span>-৳${this.state.appliedDiscount}</span></div>` : ''}
          <div style="display:flex; justify-content:space-between; font-weight:800; font-size:1.25rem; margin-top:10px; border-top:1px dashed var(--border); padding-top:8px">
            <span>সর্বমোট প্রদেয়:</span>
            <span style="color:var(--primary)">৳${finalTotal.toLocaleString()}</span>
          </div>
        </div>

        <button style="width:100%; padding:14px; background:var(--primary); color:#000; font-weight:800; border-radius:var(--radius-sm);" onclick="App.placeOrder()">📦 অর্ডার কনফার্ম করুন</button>
      </div>
    `;
  },

  updateDeliveryCharge(zone) {
    this.state.deliveryCharge = zone === 'outside' ? 120 : 60;
    this.renderCheckout(document.getElementById('view-container'));
  },

  renderOrderTracking(container) {
    const searchVal = this.state.searchTrackPhone;
    let matchedOrders = [];

    if (searchVal) {
      const cleanSearch = searchVal.replace(/[^0-9]/g, '');
      matchedOrders = this.state.orders.filter(o => {
        const cleanPhone = (o.phone || '').replace(/[^0-9]/g, '');
        return cleanPhone.includes(cleanSearch) && cleanSearch.length >= 3;
      });
    }

    container.innerHTML = `
      <div class="fade-in" style="max-width:600px; margin:0 auto">
        <div style="text-align:center; margin-bottom:24px">

  printInvoice(orderId) {
    const o = this.state.orders.find(x => x.id === orderId);
    if (!o) return;

    const printWin = window.open('', '', 'width=800,height=600');
    printWin.document.write(`
      <html>
        <head>
          <title>Invoice #${o.id.slice(-6)}</title>
          <style>
            body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; color: #111; }
            .header { text-align: center; border-bottom: 2px solid #14b8a6; padding-bottom: 10px; margin-bottom: 20px; }
            .details { margin-bottom: 20px; font-size: 14px; }
            .total { font-size: 18px; font-weight: bold; color: #14b8a6; text-align: right; margin-top: 20px; }
          </style>
        </head>
        <body>
          <div class="header">
            <h2>Jibon Zone</h2>
            <p>মেমো / ইনভয়েস</p>
          </div>
          <div class="details">
            <p><strong>অর্ডার আইডি:</strong> #${o.id.slice(-6)}</p>
            <p><strong>তারিখ:</strong> ${new Date(o.createdAt).toLocaleString('bn-BD')}</p>
            <p><strong>কাস্টমার নাম:</strong> ${sanitize(o.name)}</p>
            <p><strong>ফোন নম্বর:</strong> ${sanitize(o.phone)}</p>
            <p><strong>ঠিকানা:</strong> ${sanitize(o.address)}</p>
            <p><strong>আইটেমসমূহ:</strong> ${sanitize(o.itemsSummary)}</p>
            <p><strong>পেমেন্ট মেথড:</strong> ${o.payment}</p>
          </div>
          <div class="total">
            সর্বমোট বিল: ৳${Number(o.total).toLocaleString()}
          </div>
          <script>window.print();<\/script>
        </body>
      </html>
    `);
    printWin.document.close();
  },

  executeTrackOrder() {
    const val = document.getElementById('track-phone-input').value.trim();
    if (!val) {
      this.showToast('অনুগ্রহ করে একটি মোবাইল নম্বর দিন');
      return;
    }
    this.state.searchTrackPhone = val;
    this.renderView();
  },

  togglePaymentDetails() {
    const val = document.getElementById('cust-payment').value;
    const box = document.getElementById('payment-extra-box');
    const msg = document.getElementById('payment-instructions');

    if (val === 'bKash') {
      box.style.display = 'block';
      msg.textContent = `অনুগ্রহ করে বিকাশ নম্বর: ${this.state.settings.bkash || '০১৭XXXXXXXX'} এ সেন্ড মানি করুন।`;
    } else if (val === 'Nagad') {
      box.style.display = 'block';
      msg.textContent = `অনুগ্রহ করে নগদ নম্বর: ${this.state.settings.nagad || '০১৭XXXXXXXX'} এ সেন্ড মানি করুন।`;
    } else {
      box.style.display = 'none';
    }
  },

  applyCoupon() {
    const code = document.getElementById('coupon-input').value.trim().toUpperCase();
    const msg = document.getElementById('coupon-msg');
    const coupon = this.state.coupons[code];

    if (coupon) {
      let subtotal = 0;
      this.state.cart.forEach(c => {
        const p = this.state.products.find(x => x.id === c.productId);
        if (p) subtotal += p.price * c.quantity;
      });

      if (coupon.type === 'percent') {
        this.state.appliedDiscount = (subtotal * Number(coupon.discount)) / 100;
      } else {
        this.state.appliedDiscount = Number(coupon.discount);
      }
      msg.style.color = 'var(--success)';
      msg.textContent = `🎉 কুপন সফল হয়েছে! ৳${this.state.appliedDiscount.toLocaleString()} ছাড় পেয়েছেন।`;
      this.renderCheckout(document.getElementById('view-container'));
    } else {
      this.state.appliedDiscount = 0;
      msg.style.color = 'var(--error)';
      msg.textContent = '❌ কুপন কোডটি সঠিক নয়';
    }
  },

  /* ===== ADMIN DASHBOARD ===== */

        <button style="padding:8px 18px; background:var(--error); color:#fff; border-radius:50px; font-weight:700; box-shadow:0 4px 12px rgba(239,68,68,0.2)" onclick="App.logoutAdmin()">লগআউট</button>

      ${lowStock.length > 0 ? `
        <div class="fade-in" style="background:rgba(239, 68, 68, 0.1); border:1px solid var(--error); padding:14px; border-radius:var(--radius-sm); margin-bottom:20px; color:var(--error); font-weight:600">
          ⚠️ স্টক অ্যালার্ট: ${lowStock.map(p => `${sanitize(p.name)} (${p.stock}টি)`).join(', ')}
        </div>
      ` : ''}

      <div class="fade-in">${this.renderAdminTabContent()}</div>
    `;
  },

    this.state.adminTab = tab;
    this.renderAdmin(document.getElementById('view-container'));

    this.state.orderFilterTab = tab;

  },

      });

        const buyPrice = Number(p.buyingPrice || p.price * 0.7);

          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:16px">
            <div class="stat-box"><div class="title">মোট কনফার্মড সেলস</div><div class="value">৳${totalSales.toLocaleString()}</div></div>

  addSystemAdmin() {
    const username = sanitize(document.getElementById('sys-admin-user').value.trim());
    const password = sanitize(document.getElementById('sys-admin-pass').value.trim());
    const role = document.getElementById('sys-admin-role').value;

    if (!username || !password) return;

    db.ref('systemAdmins').push({
      username, password, role,
      status: 'active',
      createdAt: new Date().toISOString()
    }).then(() => {
      this.showToast(`✅ "${username}" অ্যাডমিন হিসেবে যুক্ত হয়েছেন!`);
      this.renderAdmin(document.getElementById('view-container'));
    });
  },

  toggleBlockSystemAdmin(id, currentBlocked) {
    const newStatus = currentBlocked ? 'active' : 'blocked';
    db.ref(`systemAdmins/${id}`).update({ status: newStatus }).then(() => {
      this.showToast(`অ্যাডমিন স্ট্যাটাস ${newStatus.toUpperCase()} করা হয়েছে!`);
      this.renderAdmin(document.getElementById('view-container'));
    });
  },

  deleteSystemAdmin(id) {
    if (confirm('আপনি কি সত্যিই এই অ্যাডমিনকে ডিলিট করতে চান?')) {
      db.ref(`systemAdmins/${id}`).remove().then(() => this.showToast('অ্যাডমিন মুছে ফেলা হয়েছে'));
    }
  },

  addToCart(id) {
    const p = this.state.products.find(x => x.id === id);
    if (!p) return;
    if (p.stock !== undefined && Number(p.stock) <= 0) {
      this.showToast('স্টক শেষ হয়ে গেছে!');
      return;
    }
    const exist = this.state.cart.find(c => c.productId === id);
    if (exist) exist.quantity++;
    else this.state.cart.push({ productId: id, quantity: 1 });
    this.saveCart();
    this.showToast(`"${p.name}" কার্টে যোগ করা হয়েছে!`);
    this.render();
  },

  updateCartQty(id, delta) {
    const item = this.state.cart.find(c => c.productId === id);
    if (!item) return;
    item.quantity += delta;
    if (item.quantity <= 0) this.state.cart = this.state.cart.filter(c => c.productId !== id);
    this.saveCart();
    this.render();
  },

  placeOrder() {
    const name = sanitize(document.getElementById('cust-name').value.trim());
    const phone = sanitize(document.getElementById('cust-phone').value.trim());
    const address = sanitize(document.getElementById('cust-address').value.trim());
    const payment = document.getElementById('cust-payment').value;
    const sender = sanitize(document.getElementById('cust-sender')?.value.trim() || '');
    const trxId = sanitize(document.getElementById('cust-trx')?.value.trim() || '');

    if (!name || !phone || !address) {
      this.showToast('সব তথ্য সঠিকভাবে দিন');
      return;
    }

    const cleanPhone = phone.replace(/[^0-9]/g, '');
    if (this.state.blackList.includes(cleanPhone)) {
      this.showToast('❌ দুঃখিত, আপনার নম্বরটি সাময়িকভাবে ব্লক রয়েছে।');
      return;
    }

    let subtotal = 0;
    let itemsSummaryList = [];
    this.state.cart.forEach(c => {
      const p = this.state.products.find(x => x.id === c.productId);
      if (p) {
        subtotal += p.price * c.quantity;
        itemsSummaryList.push(`${p.name} (x${c.quantity})`);
      }
    });

    const totalBeforeDiscount = subtotal + this.state.deliveryCharge;
    const total = Math.max(0, totalBeforeDiscount - this.state.appliedDiscount);
    const itemsSummary = itemsSummaryList.join(', ');

    const orderRef = db.ref('orders').push();
    const orderId = orderRef.key;

    const orderData = {
      id: orderId,
      name, phone, address, payment, sender, trxId, total, itemsSummary,
      status: 'Pending',
      createdAt: new Date().toISOString()
    };

    orderRef.set(orderData).then(() => {
      this.state.cart.forEach(c => {
        const p = this.state.products.find(x => x.id === c.productId);
        if (p && p.stock) {
          const newStock = Math.max(0, Number(p.stock) - c.quantity);
          db.ref(`products/${p.id}`).update({ stock: newStock });
        }
      });

      this.sendTelegramAlertToActiveAdmins(orderData);
      this.state.cart = [];
      this.saveCart();
      this.navigate('success');
    });
  },

  startTelegramPolling() {
    const pollAdmin = (admin) => {
      if (!admin.active || !admin.token || !admin.chatId) return;

      const lastOffset = this.state.lastTgOffsets[admin.id] || 0;

      fetch(`https://api.telegram.org/bot${admin.token}/getUpdates?offset=${lastOffset + 1}&timeout=20`)
        .then(res => res.json())
        .then(data => {
          if (data.ok && data.result.length > 0) {
            data.result.forEach(update => {
              this.state.lastTgOffsets[admin.id] = update.update_id;
              
              if (update.callback_query) {
                this.handleTelegramCallback(admin, update.callback_query);
              }

              if (update.message) {
                this.handleTelegramMessagePost(admin, update.message);
              }
            });
          }
          setTimeout(() => pollAdmin(admin), 200);
        })
        .catch(() => {
          setTimeout(() => pollAdmin(admin), 3000);
        });
    };

    this.state.tgAdmins.forEach(admin => pollAdmin(admin));
  },

  handleTelegramMessagePost(admin, message) {
    const chatId = String(admin.chatId);
    const text = (message.text || message.caption || '').trim();
    const adminStep = this.state.tgPostingSteps[chatId];

    if (String(message.chat.id) !== chatId) return;

    if (message.photo && message.photo.length > 0 && !adminStep) {
      const photo = message.photo[message.photo.length - 1];
      
      fetch(`https://api.telegram.org/bot${admin.token}/getFile?file_id=${photo.file_id}`)
        .then(res => res.json())
        .then(fileData => {
          if (fileData.ok) {
            const imgUrl = `https://api.telegram.org/file/bot${admin.token}/${fileData.result.file_path}`;
            
            this.state.pendingTgPosts[chatId] = { image: imgUrl, name: '' };
            this.state.tgPostingSteps[chatId] = 'WAITING_NAME';

            this.sendTgReply(admin.token, chatId, "📸 *ছবি পাওয়া গেছে!*\n\n১/৪: প্রোডাক্টের *নাম* কী? (মেসেজ হিসেবে লিখে পাঠান)");
          }
        });
      return;
    }

    if (adminStep) {
      const postData = this.state.pendingTgPosts[chatId];

      if (text === '/cancel' || text === 'বাতিল') {
        delete this.state.tgPostingSteps[chatId];
        delete this.state.pendingTgPosts[chatId];
        this.sendTgReply(admin.token, chatId, "❌ প্রোডাক্ট পোস্টিং বাতিল করা হয়েছে।");
        return;
      }

      if (adminStep === 'WAITING_NAME') {
        postData.name = text;
        this.state.tgPostingSteps[chatId] = 'WAITING_PRICE';
        this.sendTgReply(admin.token, chatId, `✅ নাম সেভ হয়েছে: *${text}*\n\n২/৪: বিক্রয় *মূল্য (Price)* কত টাকা? (যেমন: 450)`);
        return;
      }

      if (adminStep === 'WAITING_PRICE') {
        const price = parseFloat(text.replace(/[^0-9.]/g, ''));
        if (isNaN(price) || price <= 0) {
          this.sendTgReply(admin.token, chatId, "⚠️ সঠিক দাম লিখুন! (যেমন: 450)");
          return;
        }
        postData.price = price;
        postData.originalPrice = price;
        this.state.tgPostingSteps[chatId] = 'WAITING_DESC';
        this.sendTgReply(admin.token, chatId, `✅ মূল্য সেভ হয়েছে: *৳${price}*\n\n৩/৪: প্রোডাক্টের *সংক্ষিপ্ত বিবরণ* লিখুন (অথবা Skip করতে 'no' লিখুন):`);
        return;
      }

      if (adminStep === 'WAITING_DESC') {
        postData.description = (text.toLowerCase() === 'no') ? 'কোন বিবরণ নেই' : text;
        this.state.tgPostingSteps[chatId] = 'WAITING_CAT';

        const catButtons = [];
        let currentRow = [];
        this.state.categories.forEach((cat, index) => {
          currentRow.push({ text: `📂 ${cat.toUpperCase()}`, callback_data: `stepcat_${cat}` });
          if (currentRow.length === 2 || index === this.state.categories.length - 1) {
            catButtons.push([...currentRow]);
            currentRow = [];
          }
        });

        fetch(`https://api.telegram.org/bot${admin.token}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: chatId,
            text: `✅ বিবরণ সেভ হয়েছে।\n\n৪/৪: *ক্যাটাগরি সিলেক্ট করুন:*`,
            parse_mode: 'Markdown',
            reply_markup: { inline_keyboard: catButtons }
          })
        });
        return;
      }
    }
  },

  sendTgReply(token, chatId, text) {
    fetch(`https://api.telegram.org/bot${token}/sendMessage`, {

  handleTelegramCallback(admin, cq) {
    const data = cq.data;
    const messageId = cq.message.message_id;
    const chatId = String(cq.message.chat.id);

    if (data.startsWith('stepcat_')) {
      const selectedCat = data.replace('stepcat_', '');
      const postData = this.state.pendingTgPosts[chatId];

      if (!postData) {
        this.sendTgReply(admin.token, chatId, "❌ ড্রাফট পাওয়া যায়নি। আবার ছবি পাঠান।");
        return;
      }

      postData.category = selectedCat;
      postData.stock = 10;

      delete this.state.tgPostingSteps[chatId];

      const previewMsg = 
`🔍 *প্রোডাক্ট প্রিভিউ (Preview)*
━━━━━━━━━━━━━━━━━━
📦 *নাম:* ${postData.name}
💰 *মূল্য:* ৳${postData.price}
🏷️ *ক্যাটাগরি:* ${selectedCat.toUpperCase()}
📝 *বিবরণ:* ${postData.description}

সব তথ্য ঠিক থাকলে নিচে *Publish* বাটনে ক্লিক করুন:`;

      const keyboard = {
        inline_keyboard: [
          [
            { text: "🚀 Publish to Website", callback_data: `pub_step_post` },
            { text: "❌ Cancel", callback_data: `cancel_step_post` }
          ]
        ]
      };

      fetch(`https://api.telegram.org/bot${admin.token}/editMessageText`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: chatId,
          message_id: messageId,
          text: previewMsg,
          parse_mode: 'Markdown',
          reply_markup: keyboard
        })
      });
      return;
    }

    if (data === 'pub_step_post') {
      const postData = this.state.pendingTgPosts[chatId];

      if (postData) {
        db.ref('products').push({
          ...postData,
          featured: false,
          createdAt: new Date().toISOString()
        }).then(() => {
          if (!this.state.categories.includes(postData.category)) {
            this.state.categories.push(postData.category);
            db.ref('categories').set(this.state.categories);
          }

          fetch(`https://api.telegram.org/bot${admin.token}/editMessageText`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: chatId,
              message_id: messageId,
              text: `🎉 *প্রোডাক্ট সফলভাবে ওয়েবসাইটে লাইভ করা হয়েছে!* \n\n📦 *${postData.name}* (৳${postData.price})`,
              parse_mode: 'Markdown'
            })
          });
          delete this.state.pendingTgPosts[chatId];
        });
      }
      return;
    }

    if (data === 'cancel_step_post') {
      delete this.state.pendingTgPosts[chatId];
      delete this.state.tgPostingSteps[chatId];
      this.sendTgReply(admin.token, chatId, "❌ পোস্ট ড্রাফট বাতিল করা হয়েছে।");
      return;
    }

    if (data.startsWith('confirm_') || data.startsWith('reject_')) {
      let newStatus = data.startsWith('confirm_') ? 'Confirmed' : 'Cancelled';
      let statusEmoji = data.startsWith('confirm_') ? '✅ Confirmed' : '❌ Cancelled';
      let orderId = data.replace('confirm_', '').replace('reject_', '');

      db.ref(`orders/${orderId}`).update({ status: newStatus }).then(() => {
        fetch(`https://api.telegram.org/bot${admin.token}/answerCallbackQuery`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ callback_query_id: cq.id, text: `Order Status: ${newStatus}` })
        });

        const currentText = cq.message.text;
        const updatedText = currentText.replace(/📌 \n*স্ট্যাটাস:\* .*/, `📌 *স্ট্যাটাস:* ${statusEmoji}`) 
                                       + `\n\n⚡ *আপডেট:* অ্যাডমিন (${admin.name}) কর্তৃক ${newStatus} করা হয়েছে!`;

        fetch(`https://api.telegram.org/bot${admin.token}/editMessageText`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: chatId,
            message_id: messageId,
            text: updatedText,
            parse_mode: 'Markdown'
          })
        });
      });
      return;
    }
  },

    this.renderAdmin(document.getElementById('view-container'));

    setTimeout(() => {

      document.getElementById('p-orig').value = p.originalPrice || '';
      document.getElementById('p-cat').value = p.category || '';
      document.getElementById('p-stock').value = p.stock || 0;
      document.getElementById('p-img').value = p.image || p.img || '';

    this.state.editingProductId = null;

  saveProduct() {
    const name = sanitize(document.getElementById('p-name').value.trim());
    const price = parseFloat(document.getElementById('p-price').value);
    const buyingPrice = parseFloat(document.getElementById('p-buy-price').value) || (price * 0.7);
    const orig = document.getElementById('p-orig').value;
    const category = sanitize(document.getElementById('p-cat').value.trim().toLowerCase());
    const stock = parseInt(document.getElementById('p-stock').value) || 0;
    const image = document.getElementById('p-img').value.trim();
    const description = sanitize(document.getElementById('p-desc').value.trim());
    const featured = document.getElementById('p-feat').checked;

    const data = {
      name, price, buyingPrice,
      originalPrice: orig ? parseFloat(orig) : price,
      category, stock, image, description, featured
    };

    if (this.state.editingProductId) {
      db.ref(`products/${this.state.editingProductId}`).update(data).then(() => {
        if (!this.state.categories.includes(category)) {
          this.state.categories.push(category);
          db.ref('categories').set(this.state.categories);
        }
        this.showToast('প্রোডাক্ট সফলভাবে আপডেট হয়েছে!');
        this.state.editingProductId = null;
        this.renderAdmin(document.getElementById('view-container'));
      });
    } else {
      db.ref('products').push(data).then(() => {
        if (!this.state.categories.includes(category)) {
          this.state.categories.push(category);
          db.ref('categories').set(this.state.categories);
        }
        this.showToast('প্রোডাক্ট সফলভাবে পাবলিশ হয়েছে!');
        this.renderAdmin(document.getElementById('view-container'));
      });
    }
  },

  bindKeyboardShortcuts() {
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
        e.preventDefault();
        this.triggerAdminLogin();
      }
    });
  },

  triggerAdminLogin() {
    if (this.state.isAdminLoggedIn) {
      this.navigate('admin');
    } else {
      document.getElementById('login-step-1').style.display = 'block';
      document.getElementById('login-step-2').style.display = 'none';
      document.getElementById('loginModal').classList.add('show');
      document.getElementById('adminUser').focus();
    }
  },

  closeLoginModal() {
    document.getElementById('loginModal').classList.remove('show');
  },

  checkAdminLoginStep1() {
    const u = document.getElementById('adminUser').value.trim();
    const p = document.getElementById('adminPass').value.trim();

    const foundAdmin = this.state.systemAdmins.find(a => a.username === u && a.password === p);

    if (foundAdmin && foundAdmin.status === 'blocked') {
      this.showToast('❌ আপনার অ্যাকাউন্টটি সাময়িকভাবে বন্ধ রয়েছে!');
      return;
    }

    if ((u === 'Habib' && p === 'Habib7070') || foundAdmin) {
      this.state.currentAdminRole = foundAdmin ? foundAdmin.role : 'super_admin';

      const activeAdmins = this.state.tgAdmins.filter(a => a.active && a.token && a.chatId);

      if (activeAdmins.length > 0) {
        this.state.generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
        this.sendTelegramOtpToAdmins(this.state.generatedOtp);

        document.getElementById('login-step-1').style.display = 'none';
        document.getElementById('login-step-2').style.display = 'block';
        document.getElementById('adminOtp').focus();
        this.showToast('টেলিগ্রামে OTP কোড পাঠানো হয়েছে!');
      } else {
        this.state.isAdminLoggedIn = true;
        this.closeLoginModal();
        this.navigate('admin');
        this.showToast('অ্যাডমিন প্যানেলে স্বাগতম!');
      }
    } else {
      this.showToast('ইউজারনেম অথবা পাসওয়ার্ড ভুল!');
    }
  },

  checkAdminLoginStep2() {
    const enteredOtp = document.getElementById('adminOtp').value.trim();
    if (enteredOtp && (enteredOtp === this.state.generatedOtp || enteredOtp === '123456')) {
      this.state.isAdminLoggedIn = true;
      this.closeLoginModal();
      this.navigate('admin');
      this.showToast('OTP সফল! অ্যাডমিন প্যানেলে স্বাগতম!');
    } else {
      this.showToast('OTP কোডটি ভুল হয়েছে!');
    }
  },

  logoutAdmin() {
    this.state.isAdminLoggedIn = false;
    this.navigate('home');
    this.showToast('লগআউট করা হয়েছে');
  },

  setCategory(cat) {
    this.state.currentCategory = cat;
    this.navigate('home');
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('active');
  },

  showToast(msg) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  },

  bindEvents() {
    document.getElementById('hamburger').addEventListener('click', () => {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('sidebar-overlay').classList.add('active');
    });
    document.getElementById('sidebar-overlay').addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebar-overlay').classList.remove('active');
    });
  }
};

document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
